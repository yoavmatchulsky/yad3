<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Background -->
  <rect width="64" height="64" rx="14" fill="#2563eb"/>
  <!-- House roof -->
  <polygon points="32,10 56,30 8,30" fill="white"/>
  <!-- House body -->
  <rect x="12" y="28" width="40" height="24" fill="white"/>
  <!-- Door -->
  <rect x="24" y="34" width="16" height="18" rx="3" fill="#2563eb"/>
  <!-- Number 3 on door -->
  <text x="32" y="49" text-anchor="middle" fill="white" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold">3</text>
</svg>
